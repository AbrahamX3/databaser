[package]
name = "databaser"
version = "0.1.4"
edition = "2021"
description = "Start, stop and restart local MySQL, PostgreSQL and SQL Server services"
license = "MIT"
authors = ["AbrahamX3"]
repository = "https://github.com/AbrahamX3/databaser"
build = "build.rs"

[dependencies]
gpui-kit = "0.7.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Self-update from GitHub Releases (see .github/workflows/release.yml).
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "rustls",
    "github",
    "archive-zip",
    "compression-zip-deflate",
    "checksums",
] }

[target.'cfg(windows)'.dependencies]
# Safe wrappers around the Windows Service Control Manager and UAC elevation.
windows-service = "0.8"
runas = "1.2"
winreg = "0.56"
# Raw bindings, used only where the safe wrapper has no equivalent: changing a
# service's start type alone has to go through `ChangeServiceConfigW`.
# Kept on the same 0.61 line as `windows-service` so `SC_HANDLE` is one type.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# Safe Rust throughout, except for a few `#[expect(unsafe_code)]` call sites that
# reach into Win32 directly (see `services/control.rs`).
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = 10 }

[build-dependencies]
winresource = "0.1"

# Keep framework dependencies optimized in Debug so the app stays responsive
# while we iterate. This does not make compilation faster.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
