[package]
name = "databaser"
version = "0.1.0"
edition = "2021"
description = "Start, stop and restart local MySQL and PostgreSQL services"
license = "MIT"
authors = ["Abraham"]
build = "build.rs"

[dependencies]
gpui-kit = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# Safe wrappers around the Windows Service Control Manager and UAC elevation.
windows-service = "0.8"
runas = "1.2"
winreg = "0.55"

[lints.rust]
# The project uses only safe wrappers; forbid typing `unsafe` by accident.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }

[build-dependencies]
winresource = "0.1"

# Keep framework dependencies optimized in Debug so the app stays responsive
# while we iterate. This does not make compilation faster.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
