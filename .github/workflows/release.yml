name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # The asset name must contain the target triple: the in-app updater
      # (self_update) matches release assets by looking for the target string,
      # and extracts `databaser.exe` from the archive root.
      - name: Package portable archive
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $asset = "databaser-$target.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/databaser.exe -DestinationPath "dist/$asset" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Output "Building installer for version $version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\databaser.iss

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -notlike "*.sha256" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/databaser-x86_64-pc-windows-msvc.zip
            dist/Databaser-Setup-*.exe
            dist/SHA256SUMS
          generate_release_notes: true
